# Expose only the executor-owned rootless Docker API socket to the hardened
# executor through its existing private CLI alias. Historical V1 used
# ProtectHome=yes; the reviewed successor uses ProtectHome=tmpfs and two
# additional exact socket binds without exposing the user-runtime directory.
# Read-only binds still allow AF_UNIX connect. The fixed source must exist.
[Service]
RuntimeDirectory=omnilyzer/deployment/rootless-docker
RuntimeDirectoryMode=0700
BindReadOnlyPaths=/run/user/991/docker.sock:/run/omnilyzer/deployment/rootless-docker/docker.sock
