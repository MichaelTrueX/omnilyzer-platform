# Expose only the executor-owned rootless Docker API socket to the hardened
# executor. ProtectHome=yes in the reviewed service hides /run/user/991.
# Read-only mount flags still allow AF_UNIX connect; no other user-runtime
# path becomes visible. The source must exist or service startup fails.
[Service]
BindReadOnlyPaths=/run/user/991/docker.sock:/run/omnilyzer/deployment/rootless-docker/docker.sock
