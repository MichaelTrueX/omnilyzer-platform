# File: deployment/systemd/dev/analytics-broker-enabled.conf
# Purpose: approved-only drop-in for the EXISTING original Task014 broker
#          service, not a second service or port. The canary unit remains
#          unchanged until this drop-in is separately root-installed.
# Related: deployment/systemd/dev/omnilyzer-deployment-broker.service,
#          deployment/analytics_broker_service_entrypoint.py,
#          deployment/analytics_broker_service.py.
#
# Destination ONLY after explicit owner + M04 approval:
# /etc/systemd/system/omnilyzer-deployment-broker.service.d/analytics-enabled.conf
#
# Missing root-owned broker Analytics source => no fallback/activation.
# Installation or enablement is NOT performed by this file.

[Unit]
ConditionPathExists=/etc/omnilyzer/deployment/broker/analytics.json

[Service]
# Isolate all Analytics-aware imports from the protected original C31B canary tree.
WorkingDirectory=/opt/omnilyzer/deployment/analytics-app
ExecStart=
ExecStart=/opt/omnilyzer/deployment/venv/bin/python -m deployment.analytics_broker_service_entrypoint
