# File: deployment/runtime/dev/nginx/nginx.conf
# Purpose: Read-only non-root DEV canary proxy with a maintenance default.
# Related: deployment/runtime/dev/compose.yaml and /etc/nginx/runtime/active.conf.
# Temporary file locations use only the existing isolated /tmp tmpfs mount.
pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr notice;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080 default_server;
        server_name _;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"status":"maintenance","active_slot":null}\n';
    }

    # Optional directory-mounted active.conf. An empty directory is valid and safe.
    include /etc/nginx/runtime/*.conf;
}
