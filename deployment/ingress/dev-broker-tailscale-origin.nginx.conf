# C32ZC repository-only Tailscale Serve origin candidate. Do not load until
# private Serve, tailnet policy, host include layout, and live checks qualify.
server {
    listen 127.0.0.1:3032;
    server_name omnilyzerdev.tail52e570.ts.net;

    access_log off;
    add_header Cache-Control "no-store" always;
    client_max_body_size 4096;
    client_body_buffer_size 8k;
    client_body_in_file_only off;

    location = /task014/dev/promote {
        if ($http_host != "omnilyzerdev.tail52e570.ts.net") { return 400; }
        if ($request_method != POST) { return 405; }
        if ($request_uri != "/task014/dev/promote") { return 400; }
        if ($content_type != "application/json") { return 415; }
        if ($content_length = "") { return 411; }
        if ($http_transfer_encoding != "") { return 400; }
        if ($http_content_encoding != "") { return 415; }
        if ($http_cookie != "") { return 400; }
        # Defense in depth: compact JWTs cannot contain commas.
        if ($http_authorization ~ ",") { return 400; }
        if ($http_x_omnilyzer_zot_oidc ~ ",") { return 400; }
        if ($http_x_omnilyzer_forgejo_oidc ~ ",") { return 400; }

        proxy_pass http://127.0.0.1:3031;
        proxy_http_version 1.0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_cache off;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Location;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_pass_request_headers off;
        proxy_set_header Host deploy-dev.omnilyzer.ai;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Omnilyzer-Zot-OIDC $http_x_omnilyzer_zot_oidc;
        proxy_set_header X-Omnilyzer-Forgejo-OIDC $http_x_omnilyzer_forgejo_oidc;
        proxy_set_header Content-Type application/json;
        proxy_set_header Content-Length $content_length;
        proxy_set_header Connection close;
        proxy_connect_timeout 3s;
        proxy_read_timeout 900s;
        proxy_send_timeout 30s;
    }

    location / { return 404; }
}
