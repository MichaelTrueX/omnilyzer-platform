# C32Q review-only reference. Uninstalled and intentionally incomplete until a
# separately reviewed TLS certificate/key contract supplies ssl_certificate
# and ssl_certificate_key. Never include this file as-is in a live Nginx config.
# A live edge must also prove raw duplicate credential-header rejection before
# using $http_* values: Nginx variable behavior alone is not that proof.
server {
    listen 443 ssl;
    server_name deploy-dev.omnilyzer.ai;
    access_log off;
    add_header Cache-Control "no-store" always;
    client_max_body_size 4096;
    client_body_buffer_size 8k;
    client_body_in_file_only off;

    location = /task014/dev/promote {
        if ($request_method != POST) { return 405; }
        if ($request_uri != "/task014/dev/promote") { return 400; }
        if ($content_type != "application/json") { return 415; }
        if ($content_length = "") { return 411; }
        if ($http_transfer_encoding != "") { return 400; }
        if ($http_content_encoding != "") { return 415; }
        if ($http_cookie != "") { return 400; }

        proxy_pass http://127.0.0.1:3031;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_cache off;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Location;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_pass_request_headers off;
        proxy_set_header Host deploy-dev.omnilyzer.ai;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Omnilyzer-Zot-OIDC $http_x_omnilyzer_zot_oidc;
        proxy_set_header X-Omnilyzer-Forgejo-OIDC $http_x_omnilyzer_forgejo_oidc;
        proxy_set_header Content-Type application/json;
        proxy_set_header Content-Length $content_length;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / { return 404; }
}
