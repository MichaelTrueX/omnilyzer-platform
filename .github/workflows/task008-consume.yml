# File: .github/workflows/task008-consume.yml
# Purpose: Consumes exact Task 008 artifacts using a separate read-only OIDC identity.

name: Task 008 consume

on:
  push:
    branches:
      - spike/008-supply-chain
    paths:
      - spikes/supply-chain/control/consume.trigger
      - spikes/supply-chain/control/consumer-permissions.trigger

permissions: {}

jobs:
  gate:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/spike/008-supply-chain'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - name: Check out complete push history without credentials
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify complete push range
        id: classify
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] || \
             [[ ! "$AFTER_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Push range contains an invalid commit SHA" >&2
            exit 1
          fi
          if [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "An all-zero before SHA is invalid for this existing-branch spike" >&2
            exit 1
          fi
          git cat-file -e "${BEFORE_SHA}^{commit}"
          git cat-file -e "${AFTER_SHA}^{commit}"

          changed_paths_file="$RUNNER_TEMP/task008-consume-changed-paths.txt"
          changed_status_file="$RUNNER_TEMP/task008-consume-changed-status.txt"
          git diff --name-only --no-renames --diff-filter=ACDMRTUXB \
            "$BEFORE_SHA" "$AFTER_SHA" > "$changed_paths_file"
          git diff --name-status --no-renames --diff-filter=ACDMRTUXB \
            "$BEFORE_SHA" "$AFTER_SHA" > "$changed_status_file"
          mapfile -t changed_paths < "$changed_paths_file"

          mode=none
          if [[ "${#changed_paths[@]}" -eq 1 ]]; then
            changed_status="$(<"$changed_status_file")"
            if [[ "${changed_paths[0]}" == \
                  "spikes/supply-chain/control/consume.trigger" ]] && \
               [[ "$changed_status" == \
                  $'M\tspikes/supply-chain/control/consume.trigger' ]]; then
              mode=release
            elif [[ "${changed_paths[0]}" == \
                    "spikes/supply-chain/control/consumer-permissions.trigger" ]] && \
                 [[ "$changed_status" == \
                    $'A\tspikes/supply-chain/control/consumer-permissions.trigger' ]]; then
              mode=permission
            fi
          fi
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"

  consume:
    needs: gate
    if: needs.gate.outputs.mode == 'release'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE_REPOSITORY: docker.cloudsmith.io/omnilyzer/platform-spike/omnilyzer-supply-chain-spike
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Read and validate coordinated release version
        shell: bash
        run: |
          set -euo pipefail
          release_version="$(python - <<'PY'
          from pathlib import Path
          import re
          import sys

          content = Path("spikes/supply-chain/control/consume.trigger").read_text(
              encoding="utf-8"
          )
          if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+\n?", content) is None:
              print("consume.trigger must contain exactly an X.Y.Z version", file=sys.stderr)
              raise SystemExit(1)
          print(content.rstrip("\n"))
          PY
          )"
          printf 'RELEASE_VERSION=%s\n' "$release_version" >> "$GITHUB_ENV"

      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Set up Node
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'

      - name: Authenticate short-lived read-only Cloudsmith consumer
        # cloudsmith-io/cloudsmith-cli-action v3.1.0
        uses: cloudsmith-io/cloudsmith-cli-action@ad73fafb92e3e29a5166c529464c2df7658a608e
        with:
          oidc-namespace: omnilyzer
          oidc-service-slug: gha-consumer
          cli-version: '1.26.0'
          verify-auth: true
          export-auth-token: true

      - name: Install and verify exact Python package from Cloudsmith
        shell: bash
        run: |
          set -euo pipefail
          export PIP_INDEX_URL="https://token:${CLOUDSMITH_API_KEY}@dl.cloudsmith.io/basic/omnilyzer/platform-spike/python/simple/"
          python -m venv "$RUNNER_TEMP/task008-python-consumer"
          "$RUNNER_TEMP/task008-python-consumer/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: --no-deps \
            "omnilyzer-supply-chain-spike==${RELEASE_VERSION}"
          "$RUNNER_TEMP/task008-python-consumer/bin/python" -c \
            'import os; import omnilyzer_supply_chain_spike as p; assert p.report() == os.environ["RELEASE_VERSION"]'

      - name: Install and verify exact npm package from Cloudsmith
        shell: bash
        run: |
          set -euo pipefail
          npm_project="$RUNNER_TEMP/task008-npm-consumer"
          mkdir "$npm_project"
          printf '%s\n' '{"name":"task008-consumer","private":true,"type":"module"}' \
            > "$npm_project/package.json"
          npm_config="$RUNNER_TEMP/task008-npmrc"
          printf '%s\n' \
            '@omnilyzer:registry=https://npm.cloudsmith.io/omnilyzer/platform-spike/' \
            '//npm.cloudsmith.io/omnilyzer/platform-spike/:_authToken=${CLOUDSMITH_API_KEY}' \
            > "$npm_config"
          NPM_CONFIG_USERCONFIG="$npm_config" npm install \
            --prefix "$npm_project" --save-exact --ignore-scripts \
            "@omnilyzer/supply-chain-spike@${RELEASE_VERSION}"
          (
            cd "$npm_project"
            node --input-type=module -e \
              'import { report } from "@omnilyzer/supply-chain-spike"; if (report() !== process.env.RELEASE_VERSION) process.exit(1)'
          )

      - name: Authenticate Docker with short-lived Cloudsmith identity
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$CLOUDSMITH_API_KEY" | docker login docker.cloudsmith.io \
            --username token --password-stdin
          touch "$RUNNER_TEMP/task008-docker-login"

      - name: Pull and inspect exact OCI artifact without running it
        shell: bash
        run: |
          set -euo pipefail
          image_ref="${IMAGE_REPOSITORY}:${RELEASE_VERSION}"
          docker pull "$image_ref"
          observed_version="$(docker image inspect "$image_ref" \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}')"
          test "$observed_version" = "$RELEASE_VERSION"
          oci_reference="$(docker image inspect "$image_ref" \
            --format '{{index .RepoDigests 0}}')"
          if [[ ! "$oci_reference" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "Pulled image has no valid immutable digest" >&2
            exit 1
          fi
          printf 'Verified OCI digest: `%s`\n' "$oci_reference" >> "$GITHUB_STEP_SUMMARY"

      - name: Log out from Cloudsmith Docker registry
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/task008-docker-login" ]]; then
            docker logout docker.cloudsmith.io
          fi

  consumer-permission-probe:
    needs: gate
    if: needs.gate.outputs.mode == 'permission'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDSMITH_REPOSITORY: omnilyzer/platform-spike
    steps:
      - name: Authenticate short-lived read-only Cloudsmith consumer for permission probe
        # cloudsmith-io/cloudsmith-cli-action v3.1.0
        uses: cloudsmith-io/cloudsmith-cli-action@ad73fafb92e3e29a5166c529464c2df7658a608e
        with:
          oidc-namespace: omnilyzer
          oidc-service-slug: gha-consumer
          cli-version: '1.26.0'
          verify-auth: true
          export-auth-token: true

      - name: Prove consumer upload is denied and repository read still succeeds
        shell: bash
        run: |
          set -euo pipefail
          probe_filename="task008b-consumer-${GITHUB_RUN_ID}.txt"
          probe_filepath="task008b/permissions/consumer/${GITHUB_RUN_ID}/${probe_filename}"
          probe_file="$RUNNER_TEMP/$probe_filename"
          denial_log="$RUNNER_TEMP/task008b-consumer-denial.log"
          package_json="$RUNNER_TEMP/task008b-consumer-read.json"

          require_authorization_denial() {
            python - "$1" "$2" <<'PY'
          from pathlib import Path
          import re
          import sys

          output = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          denial = re.compile(
              r"(?:\bhttp(?:/\d(?:\.\d)?)?\s*403\b|"
              r"\b403\b[^\n]*\bforbidden\b|\bforbidden\b|"
              r"do not have permission|permission denied|"
              r"insufficient permissions?)",
              re.IGNORECASE,
          )
          if denial.search(output) is None:
              print(
                  f"INCONCLUSIVE: {sys.argv[2]} failed without recognizable "
                  "authorization-denial evidence",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          PY
          }

          printf 'Task 008B consumer write-denial probe for run %s\n' "$GITHUB_RUN_ID" \
            > "$probe_file"

          set +e
          cloudsmith push generic "$CLOUDSMITH_REPOSITORY" "$probe_file" \
            --filepath "$probe_filepath" \
            2>&1 | tee "$denial_log"
          upload_status=${PIPESTATUS[0]}
          set -e
          if [[ "$upload_status" -eq 0 ]]; then
            echo "Consumer unexpectedly uploaded a sacrificial Generic artifact" >&2
            exit 1
          fi
          require_authorization_denial "$denial_log" "consumer upload"

          # A successful authenticated read distinguishes authorization denial
          # from an expired credential or a Cloudsmith/network outage.
          cloudsmith list packages "$CLOUDSMITH_REPOSITORY" \
            --query "format:generic AND filename:${probe_filename}" \
            --output-format json > "$package_json"
          python - "$package_json" "$probe_filename" "$probe_filepath" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          records = payload.get("data")
          if not isinstance(records, list):
              print("Cloudsmith package list did not return a data list", file=sys.stderr)
              raise SystemExit(1)
          matches = [
              package
              for package in records
              if package.get("format") == "generic"
              and package.get("filename") == sys.argv[2]
              and package.get("filepath") == sys.argv[3]
          ]
          if matches:
              print(
                  f"consumer upload left {len(matches)} exact artifact(s)",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          PY
