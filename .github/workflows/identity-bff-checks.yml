name: Identity BFF source checks
on:
  pull_request:
    paths:
      - "services/identity/**"
      - ".github/workflows/identity-bff-checks.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned BFF runtime dependencies
        run: python -m pip install -r services/identity/requirements.txt
      - name: Compile and test confidential identity adapter
        working-directory: services/identity
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v
