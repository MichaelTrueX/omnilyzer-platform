# File: .github/workflows/control-plane-regressions.yml
# Purpose: Run existing, non-live Task 014 deployment and Task 013 release
#   Python regression suites automatically before merging and after main changes.
# Related: deployment/tests/, release/tests/, deployment/pyproject.toml,
#   release/pyproject.toml, .github/workflows/repository-quality.yml,
#   .github/workflows/design-system-browser.yml.
#
# Security: Hosted ephemeral runner only. Read-only repository permissions,
# no long-lived tokens, no environment secrets, no access to DEV services,
# no root-owned host changes, and no deployment actions.
#
# Coverage: All Python tests in the deployment and release packages.
# The separate design-system browser workflow already runs Chromium tests.
# Do not path-filter this workflow: it must remain available as a PR gate.

name: Control-plane Python regression

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Task 014: validate deployment identity, OIDC, broker, executor,
  # migration-state, rootless-Docker and fail-closed policy contracts.
  deployment-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Retrieve pull-request code without persisting any GitHub credentials.
      - name: Check out repository without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Historical migration tests require every reviewed Git commit

      # Match deployment/pyproject.toml's Python 3.12-only requirement.
      - name: Set up accepted Python interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      # Use the existing exact-hash lock, including transitive versions
      # required by the C17 dependency-boundary tests.
      - name: Install hash-verified deployment dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            --only-binary=:all: --require-hashes \
            -r deployment/requirements-linux-x86_64-py312.lock

      # Workflow-policy and JSON schema tests use two reviewed test-only
      # libraries (already version-pinned in spikes/api/requirements-lock.txt).
      - name: Install non-live test libraries
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            --only-binary=:all: 'PyYAML==6.0.3' 'jsonschema==4.26.0'

      # unittest discovery fails the job on any failed test or import error.
      # This is a repository-only test run, not a privileged live-host check.
      - name: Run deployment regression suite
        run: |
          python -m unittest discover \
            --start-directory deployment/tests \
            --top-level-directory . \
            --pattern 'test_*.py'

  # Task 013: validate immutable release, manifest, provenance and
  # supply-chain contracts with the Python standard-library test suite.
  release-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Use an ephemeral checkout without stored authentication credentials.
      - name: Check out repository without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Historical migration tests require every reviewed Git commit

      # The release package supports Python 3.12 and declares no runtime deps.
      - name: Set up accepted Python interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      # Existing release policy tests parse YAML workflows. This test-only
      # dependency is already pinned in spikes/api/requirements-lock.txt.
      - name: Install workflow-test YAML parser
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            --only-binary=:all: 'PyYAML==6.0.3'

      # Run the full existing non-live release contract regression suite.
      - name: Run release regression suite
        run: |
          python -m unittest discover \
            --start-directory release/tests \
            --top-level-directory . \
            --pattern 'test_*.py'
