# File: .github/workflows/platform-promote.yml
# Purpose: The existing Task014 protected manual promotion request and
#          three-audience OIDC broker submission; canary is the default.
# Related: deployment.promotion (original canary), deployment.analytics_ci_request
#          (one signed Analytics 0.15.0 DEV request), deployment.broker_https_ingress
#          and deployment.dev_live_activation_policy (unchanged canary authority).
# Security: Analytics does not expand the original canary C33W allowlist, create
#           a second ingress, activate privileged source, or bypass replay.
name: Platform promotion request

on:
  workflow_dispatch:
    inputs:
      auth_probe:
        description: Read-only private Zot Docker authentication check; NEVER promote
        required: false
        type: boolean
        default: false
      product_id:
        description: Exact Task014 product (original canary is default)
        required: true
        type: choice
        options: [canary, analytics]
        default: canary
      analytics_installed_commit:
        description: Root-reviewed Analytics installed source SHA
        required: false
        type: string
        default: ""
      analytics_source_claim_sha256:
        description: Signed source claim SHA256; leave all three hashes empty for authenticated lookup
        required: false
        type: string
        default: ""
      target_stage:
        description: Ordered target stage
        required: true
        type: choice
        options: [dev, staging, prod]
        default: dev
      release_version:
        description: Strict accepted release version
        required: false
        type: string
        default: ""
      source_sha:
        description: Exact accepted release source SHA
        required: false
        type: string
        default: ""
      manifest_digest:
        description: Exact accepted OCI manifest digest
        required: false
        type: string
        default: ""
      release_manifest_sha256:
        description: Exact manifest SHA256; all three hashes may be empty for Analytics lookup
        required: false
        type: string
        default: ""
      provenance_sha256:
        description: Exact provenance SHA256; all three hashes may be empty for Analytics lookup
        required: false
        type: string
        default: ""
      originating_release_run_id:
        description: Successful Task 013 release run ID
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  # Section 0: the only operation permitted for diagnostic-only dispatch.
  # This job cannot reach the broker, Tailscale, deployment gate or PROD.
  private_zot_readonly_probe:
    if: ${{ inputs.auth_probe == true }}
    runs-on: ubuntu-24.04
    environment: task014-dev
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Read protected main workflow source without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Probe private Zot Docker authentication without deployment
        shell: bash
        env:
          DIAGNOSTIC_TARGET_STAGE: ${{ inputs.target_stage }}
        run: |
          set -euo pipefail
          umask 077
          test "$DIAGNOSTIC_TARGET_STAGE" = dev
          python3 -m release.private_zot_auth_probe

  # Section 1: no promotion policy or replay inspection during diagnostic.
  gate:
    if: ${{ inputs.auth_probe != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out promotion policy without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate immutable request against disabled Phase 1 environment
        shell: bash
        env:
          TARGET_STAGE: ${{ inputs.target_stage }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          MANIFEST_DIGEST: ${{ inputs.manifest_digest }}
          RELEASE_MANIFEST_SHA256: ${{ inputs.release_manifest_sha256 }}
          PROVENANCE_SHA256: ${{ inputs.provenance_sha256 }}
          ORIGINATING_RELEASE_RUN_ID: ${{ inputs.originating_release_run_id }}
          REQUESTED_BY: github:${{ github.actor }}
          TASK014_PRODUCT: ${{ inputs.product_id }}
          ANALYTICS_INSTALLED_COMMIT: ${{ inputs.analytics_installed_commit }}
          ANALYTICS_SOURCE_CLAIM_SHA256: ${{ inputs.analytics_source_claim_sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "MichaelTrueX/omnilyzer-platform"
          # Analytics may resolve all three package hashes only AFTER the
          # existing Forgejo OIDC issuance. Canary still requires all fields.
          test -n "$RELEASE_VERSION"
          test -n "$SOURCE_SHA"
          test -n "$MANIFEST_DIGEST"
          test -n "$ORIGINATING_RELEASE_RUN_ID"
          test "$GITHUB_REF" = "refs/heads/main"
          if [ "$TASK014_PRODUCT" = analytics ]; then
            python3 -m deployment.analytics_ci_request --preflight
          elif [ "$TASK014_PRODUCT" = canary ]; then
            test -n "$RELEASE_MANIFEST_SHA256"
            test -n "$PROVENANCE_SHA256"
            request="$RUNNER_TEMP/task014-promotion-request.json"
          python3 -m deployment.promotion \
            --release-version "$RELEASE_VERSION" \
            --source-sha "$SOURCE_SHA" \
            --manifest-digest "$MANIFEST_DIGEST" \
            --release-manifest-sha256 "$RELEASE_MANIFEST_SHA256" \
            --provenance-sha256 "$PROVENANCE_SHA256" \
            --originating-release-run-id "$ORIGINATING_RELEASE_RUN_ID" \
            --target-stage "$TARGET_STAGE" \
            --requested-by "$REQUESTED_BY" \
            --output "$request"
          if [ "$TARGET_STAGE" = "dev" ]; then
            python3 -m deployment.dev_live_activation_policy \
              --request "$request" \
              --environment "deployment/dev-live-activation.json"
          else
            python3 -m deployment.controller \
              --request "$request" \
              --environment "deployment/environments/$TARGET_STAGE.json"
          fi
          else
            exit 1
          fi

  deploy_dev:
    # Defense in depth: never enter the DEV executor on a diagnostic run.
    if: ${{ inputs.auth_probe != true && inputs.target_stage == 'dev' }}
    needs: gate
    runs-on: ubuntu-24.04
    environment: task014-dev
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out promotion policy without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create private canonical DEV promotion request
        shell: bash
        env:
          TARGET_STAGE: ${{ inputs.target_stage }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          MANIFEST_DIGEST: ${{ inputs.manifest_digest }}
          RELEASE_MANIFEST_SHA256: ${{ inputs.release_manifest_sha256 }}
          PROVENANCE_SHA256: ${{ inputs.provenance_sha256 }}
          ORIGINATING_RELEASE_RUN_ID: ${{ inputs.originating_release_run_id }}
          REQUESTED_BY: github:${{ github.actor }}
          TASK014_PRODUCT: ${{ inputs.product_id }}
          ANALYTICS_INSTALLED_COMMIT: ${{ inputs.analytics_installed_commit }}
          ANALYTICS_SOURCE_CLAIM_SHA256: ${{ inputs.analytics_source_claim_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = "MichaelTrueX/omnilyzer-platform"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$TARGET_STAGE" = dev
          if [ "$TASK014_PRODUCT" = analytics ]; then
            python3 -m deployment.analytics_ci_request --preflight
          elif [ "$TASK014_PRODUCT" = canary ]; then
            python3 -m deployment.promotion \
            --release-version "$RELEASE_VERSION" \
            --source-sha "$SOURCE_SHA" \
            --manifest-digest "$MANIFEST_DIGEST" \
            --release-manifest-sha256 "$RELEASE_MANIFEST_SHA256" \
            --provenance-sha256 "$PROVENANCE_SHA256" \
            --originating-release-run-id "$ORIGINATING_RELEASE_RUN_ID" \
            --target-stage "$TARGET_STAGE" \
            --requested-by "$REQUESTED_BY" \
            --output "$RUNNER_TEMP/task014-dev-promotion-request.json"
          else
            exit 1
          fi
      # Direct bootstrap is deliberate: the official Tailscale v4 action injects
      # route acceptance, which conflicts with the reviewed route-rejection setting.
      - name: Join private Task 014 tailnet with direct federated identity
        shell: bash
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
        run: |
          set -euo pipefail
          umask 077
          TS_VERSION="1.102.4"
          TS_SHA256="50748df1045e60b5b695f19f4c56b0da36c019948b440fb456b6584a50f0d8b9"
          TS_ROOT="$RUNNER_TEMP/task014-tailscale"
          TS_DIR="$TS_ROOT/tailscale_${TS_VERSION}_amd64"
          export TS_VERSION TS_SHA256 TS_ROOT TS_DIR

          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          from urllib import request

          version = os.environ["TS_VERSION"]
          expected = os.environ["TS_SHA256"]
          root = Path(os.environ["TS_ROOT"])
          url = (
              "https://pkgs.tailscale.com/stable/"
              f"tailscale_{version}_amd64.tgz"
          )
          root.mkdir(mode=0o700)
          partial = root / "tailscale.tgz.part"
          final = root / "tailscale.tgz"

          class NoRedirect(request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise ValueError("Tailscale tarball redirect rejected")

          opener = request.build_opener(request.ProxyHandler({}), NoRedirect)
          req = request.Request(
              url,
              headers={"User-Agent": "omnilyzer-task014-promotion"},
          )
          digest = hashlib.sha256()
          total = 0
          with opener.open(req, timeout=30) as response, partial.open("xb") as output:
              if response.status != 200 or response.geturl() != url:
                  raise ValueError("unexpected Tailscale tarball response")
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk:
                      break
                  total += len(chunk)
                  if total > 64 * 1024 * 1024:
                      raise ValueError("Tailscale tarball exceeds size bound")
                  digest.update(chunk)
                  output.write(chunk)
          if total == 0 or digest.hexdigest() != expected:
              raise ValueError("Tailscale tarball SHA-256 mismatch")
          partial.chmod(0o600)
          partial.replace(final)
          PY

          tar -xzf "$TS_ROOT/tailscale.tgz" -C "$TS_ROOT"
          test -x "$TS_DIR/tailscale"
          test -x "$TS_DIR/tailscaled"

          sudo -n sh -c '
            set -eu
            printf "%s\n" "$$" >"$1"
            chown "$SUDO_UID:$SUDO_GID" "$1"
            chmod 0600 "$1"
            exec "$2" --state=mem:
          ' sh "$TS_ROOT/tailscaled.pid" "$TS_DIR/tailscaled" \
            >"$TS_ROOT/tailscaled.log" 2>&1 &

          daemon_ready=false
          for _ in {1..30}; do
            if sudo -n "$TS_DIR/tailscale" status --json \
                >"$TS_ROOT/prelogin-status.json" 2>/dev/null; then
              daemon_ready=true
              break
            fi
            sleep 0.5
          done
          test "$daemon_ready" = true

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib import parse, request

          oidc_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          runner_token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          audience = os.environ["TS_AUDIENCE"]
          parsed = parse.urlsplit(oidc_url)
          try:
              request_port = parsed.port
          except ValueError as exc:
              raise ValueError("invalid GitHub OIDC request port") from exc
          request_host = (parsed.hostname or "").lower()
          query = parse.parse_qsl(
              parsed.query,
              keep_blank_values=True,
              strict_parsing=False,
          )
          if (
              parsed.scheme != "https"
              or not request_host.endswith(".actions.githubusercontent.com")
              or parsed.username is not None
              or parsed.password is not None
              or request_port not in (None, 443)
              or parsed.fragment
              or any(key == "audience" for key, _value in query)
              or not runner_token
              or not audience
          ):
              raise ValueError("invalid GitHub OIDC configuration")

          separator = "&" if parsed.query else "?"
          url = oidc_url + separator + parse.urlencode({"audience": audience})

          class NoRedirect(request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise ValueError("GitHub OIDC redirect rejected")

          opener = request.build_opener(request.ProxyHandler({}), NoRedirect)
          req = request.Request(
              url,
              headers={"Authorization": "Bearer " + runner_token},
          )
          with opener.open(req, timeout=30) as response:
              if response.status != 200:
                  raise ValueError("GitHub OIDC endpoint did not return HTTP 200")
              raw = response.read(16385)
          if len(raw) > 16384:
              raise ValueError("GitHub OIDC response too large")

          def unique_members(pairs):
              value = {}
              for key, member in pairs:
                  if key in value:
                      raise ValueError("duplicate GitHub OIDC response member")
                  value[key] = member
              return value

          value = json.loads(raw, object_pairs_hook=unique_members)
          if (
              not isinstance(value, dict)
              or set(value) != {"value"}
              or not isinstance(value["value"], str)
          ):
              raise ValueError("invalid GitHub OIDC response")
          jwt = value["value"]
          parts = jwt.split(".")
          if (
              len(jwt) > 16384
              or len(parts) != 3
              or any(
                  not part
                  or not part.isascii()
                  or not all(char.isalnum() or char in "-_" for char in part)
                  for part in parts
              )
          ):
              raise ValueError("invalid GitHub OIDC JWT structure")

          token_path = Path(os.environ["TS_ROOT"]) / "id-token"
          with token_path.open("x", encoding="ascii") as output:
              output.write(jwt)
          token_path.chmod(0o600)
          PY

          sudo -n "$TS_DIR/tailscale" up \
            --advertise-tags=tag:omnilyzer-task014-ci \
            --hostname="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --accept-routes=false \
            --accept-dns=true \
            --shields-up=true \
            --timeout=2m \
            --client-id="${TS_OAUTH_CLIENT_ID}?preauthorized=true&ephemeral=true" \
            --id-token="file:$TS_ROOT/id-token"
          rm -f "$TS_ROOT/id-token"

          sudo -n "$TS_DIR/tailscale" status --json \
            >"$TS_ROOT/connected-status.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["TS_ROOT"]) / "connected-status.json"
          raw = path.read_bytes()
          if not 1 <= len(raw) <= 1024 * 1024:
              raise ValueError("invalid Tailscale status size")
          value = json.loads(raw)
          if not isinstance(value, dict) or value.get("BackendState") != "Running":
              raise ValueError("Tailscale did not reach Running state")
          PY
      - name: Submit DEV promotion once
        shell: bash
        env:
          TASK014_PRODUCT: ${{ inputs.product_id }}
          TARGET_STAGE: ${{ inputs.target_stage }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          MANIFEST_DIGEST: ${{ inputs.manifest_digest }}
          RELEASE_MANIFEST_SHA256: ${{ inputs.release_manifest_sha256 }}
          PROVENANCE_SHA256: ${{ inputs.provenance_sha256 }}
          ORIGINATING_RELEASE_RUN_ID: ${{ inputs.originating_release_run_id }}
          ANALYTICS_INSTALLED_COMMIT: ${{ inputs.analytics_installed_commit }}
          ANALYTICS_SOURCE_CLAIM_SHA256: ${{ inputs.analytics_source_claim_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import stat
          import sys
          import time
          from urllib import error, parse, request

          from deployment.ci_oidc_diagnostics import diagnose_oidc_claims

          AUDIENCES = (
              "https://deploy-dev.omnilyzer.ai/task014-dev",
              "https://oci-dev.omnilyzer.ai",
              "u:3:d4f50b90-f001-4b9f-ad1e-487080ec44fb",
          )
          ENDPOINT = "https://omnilyzerdev.tail52e570.ts.net/task014/dev/promote"

          class NoRedirect(request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise ValueError("OIDC or broker redirect rejected")

          opener = request.build_opener(request.ProxyHandler({}), NoRedirect)
          oidc_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          oidc_token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          if parse.urlsplit(oidc_url).scheme != "https" or not oidc_token:
              raise ValueError("invalid GitHub OIDC endpoint configuration")

          def github_token(audience):
              separator = "&" if parse.urlsplit(oidc_url).query else "?"
              url = oidc_url + separator + parse.urlencode({"audience": audience})
              req = request.Request(url, headers={"Authorization": "Bearer " + oidc_token})
              with opener.open(req, timeout=30) as response:
                  if response.status != 200:
                      raise ValueError("GitHub OIDC endpoint did not return HTTP 200")
                  raw = response.read(16385)
              if len(raw) > 16384:
                  raise ValueError("GitHub OIDC response too large")
              def unique_members(pairs):
                  value = {}
                  for key, member in pairs:
                      if key in value:
                          raise ValueError("duplicate GitHub OIDC response member")
                      value[key] = member
                  return value

              value = json.loads(raw, object_pairs_hook=unique_members)
              if not isinstance(value, dict) or set(value) != {"value"} or not isinstance(value["value"], str):
                  raise ValueError("invalid GitHub OIDC response")
              jwt = value["value"]
              if len(jwt) > 16384 or len(jwt.split(".")) != 3 or any(
                  not part or not part.isascii() or not all(char.isalnum() or char in "-_" for char in part)
                  for part in jwt.split(".")
              ):
                  raise ValueError("invalid GitHub OIDC JWT structure")
              return jwt

          deployment_jwt, zot_jwt, forgejo_jwt = map(github_token, AUDIENCES)
          if len({deployment_jwt, zot_jwt, forgejo_jwt}) != 3:
              raise ValueError("GitHub OIDC audiences did not yield distinct tokens")
          # Review-only diagnostic: decode bounded claims to compare to the
          # already-reviewed broker policy. This does NOT verify signatures,
          # authorize a deployment, or print tokens/claim values. In the real
          # GitHub runner GITHUB_SHA is always supplied; synthetic contract
          # tests omit it and therefore exercise the existing path.
          if os.environ.get("GITHUB_SHA"):
              codes = diagnose_oidc_claims(
                  (deployment_jwt, zot_jwt, forgejo_jwt),
                  expected_workflow_sha=os.environ["GITHUB_SHA"],
                  run_id=os.environ.get("GITHUB_RUN_ID", ""),
                  run_attempt=os.environ.get("GITHUB_RUN_ATTEMPT", ""),
                  actor_id=os.environ.get("GITHUB_ACTOR_ID", ""),
                  received_at=int(time.time()),
              )
              print("task014_diag oidc_codes=" + ",".join(codes),
                    file=sys.stderr)
              if codes != ("ok",):
                  raise ValueError("DEV OIDC claim diagnostic rejected before POST")
          # Canary uses unchanged original schema-v1 bytes. Only Analytics
          # creates schema-v2 bytes after GitHub issues the ephemeral OIDC JWT.
          # The original root-owned broker still verifies all actual authority.
          if os.environ.get("TASK014_PRODUCT") == "analytics":
              from deployment.analytics_ci_request import (
                  build_analytics_ci_request, resolve_analytics_ci_release_inputs,
              )
              analytics_environment = resolve_analytics_ci_release_inputs(
                  environment=os.environ, forgejo_oidc_token=forgejo_jwt,
              )
              body = build_analytics_ci_request(
                  deployment_oidc_token=deployment_jwt, environment=analytics_environment,
              )
          elif os.environ.get("TASK014_PRODUCT") in ("canary", None):
              path = Path(os.environ["RUNNER_TEMP"]) / "task014-dev-promotion-request.json"
              if path.is_symlink() or not path.is_file() or stat.S_IMODE(path.stat().st_mode) != 0o600:
                  raise ValueError("private canonical promotion request missing")
              body = path.read_bytes()
              if not 1 <= len(body) <= 4096:
                  raise ValueError("invalid canonical promotion request size")
          else:
              raise ValueError("unrecognized Task014 product")
          req = request.Request(ENDPOINT, data=body, method="POST", headers={
              "Authorization": "Bearer " + deployment_jwt,
              "X-Omnilyzer-Zot-OIDC": zot_jwt,
              "X-Omnilyzer-Forgejo-OIDC": forgejo_jwt,
              "Content-Type": "application/json",
          })
          try:
              with opener.open(req, timeout=930) as response:
                  if response.status != 202 or response.read(24) != b'{"status":"accepted"}\n':
                      raise ValueError("DEV broker did not return the exact accepted response")
          except error.HTTPError as refused:
              # Only the numeric status and exact fixed-body shape are printed.
              # Never log the response itself or any request/token/claim bytes.
              sample = refused.read(65)
              shape = (
                  "fixed_broker_rejection_shape"
                  if refused.code == 403
                  and sample == b'{"status":"rejected"}\n'
                  else "other_response_shape"
              )
              print("task014_diag http_status=" + str(refused.code)
                    + " response_shape=" + shape, file=sys.stderr)
              raise
          PY
      - name: Leave private Task 014 tailnet
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          TS_ROOT="$RUNNER_TEMP/task014-tailscale"
          TS_DIR="$TS_ROOT/tailscale_1.102.4_amd64"
          rm -f "$TS_ROOT/id-token"
          if [ -x "$TS_DIR/tailscale" ]; then
            sudo -n "$TS_DIR/tailscale" logout >/dev/null 2>&1 || true
          fi
          if [ -f "$TS_ROOT/tailscaled.pid" ]; then
            read -r daemon_pid <"$TS_ROOT/tailscaled.pid"
            case "$daemon_pid" in
              ''|*[!0-9]*)
                echo "invalid tailscaled PID file" >&2
                exit 1
                ;;
            esac
            if sudo -n test -e "/proc/$daemon_pid/exe"; then
              daemon_exe="$(sudo -n readlink -f "/proc/$daemon_pid/exe")"
              test "$daemon_exe" = "$TS_DIR/tailscaled"
              sudo -n kill -TERM "$daemon_pid"
            fi
          fi
