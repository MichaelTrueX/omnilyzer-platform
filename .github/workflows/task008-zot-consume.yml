# Task 008D independent read-only persistence validation. A trigger addition cannot obtain OIDC.
name: Task 008D zot consume

on:
  push:
    branches:
      - spike/008d-zot-registry
    paths:
      - spikes/supply-chain/control/zot-consume.trigger

permissions: {}

concurrency:
  group: task008-zot-consume-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/spike/008d-zot-registry'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - name: Check out complete push history without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify exact trigger-only push range
        id: classify
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          trigger='spikes/supply-chain/control/zot-consume.trigger'
          [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AFTER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]
          git cat-file -e "${BEFORE_SHA}^{commit}"; git cat-file -e "${AFTER_SHA}^{commit}"
          paths="$RUNNER_TEMP/zot-consume-paths"; states="$RUNNER_TEMP/zot-consume-states"
          git diff --name-only --no-renames --diff-filter=ACDMRTUXB "$BEFORE_SHA" "$AFTER_SHA" > "$paths"
          git diff --name-status --no-renames --diff-filter=ACDMRTUXB "$BEFORE_SHA" "$AFTER_SHA" > "$states"
          mapfile -t changed < "$paths"
          mode=none
          if [[ "${#changed[@]}" -eq 1 ]] && [[ "${changed[0]}" == "$trigger" ]] && \
             [[ "$(<"$states")" == $'M\tspikes/supply-chain/control/zot-consume.trigger' ]]; then
            mode=consume
          fi
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"

  fixture-build:
    needs: gate
    if: needs.gate.outputs.mode == 'consume'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.fixture.outputs.tag }}
    steps:
      - name: Check out without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rebuild and validate recorded deterministic baseline
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t values < <(python3 - spikes/supply-chain/control/zot-consume.trigger <<'PY'
          import json,re,sys
          value=json.load(open(sys.argv[1]))
          fields={'state','tag','manifest_digest','config_digest','layer_digest'}
          if set(value) != fields or value['state'] != 'ready': raise SystemExit('consumer trigger is not ready')
          if re.fullmatch(r'task008d-[0-9]+-[0-9]+', value['tag']) is None: raise SystemExit('invalid tag')
          if any(re.fullmatch(r'sha256:[0-9a-f]{64}', value[k]) is None for k in fields-{'state','tag'}): raise SystemExit('invalid digest')
          for key in ('tag','manifest_digest','config_digest','layer_digest'): print(value[key])
          PY
          )
          tag="${values[0]}"
          python3 spikes/supply-chain/scripts/build_zot_fixture.py \
            --output "$RUNNER_TEMP/task008d-zot-handoff" --source-commit "$GITHUB_SHA" --tag "$tag"
          python3 - "$RUNNER_TEMP/task008d-zot-handoff/handoff.json" "${values[@]:1}" <<'PY'
          import json,sys
          record=json.load(open(sys.argv[1])); expected=sys.argv[2:]
          observed=[record['baseline'][key] for key in ('manifest_digest','config_digest','layer_digest')]
          if observed != expected: raise SystemExit('recorded baseline does not match rebuilt fixture')
          PY
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - name: Upload minimal read-only verification handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.7.0
        with:
          name: task008d-zot-consume-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/task008d-zot-handoff
          if-no-files-found: error
          retention-days: 1

  consumer-probe:
    needs: [gate, fixture-build]
    if: needs.gate.outputs.mode == 'consume' && needs.fixture-build.result == 'success'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ZOT_REGISTRY: https://oci-dev.omnilyzer.ai
      ZOT_AUDIENCE: https://oci-dev.omnilyzer.ai
    steps:
      - name: Check out without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download exact verification handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.3.0
        with:
          name: task008d-zot-consume-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/task008d-zot-handoff
      - name: Verify handoff and recorded digests before requesting OIDC
        shell: bash
        env:
          BASELINE_TAG: ${{ needs.fixture-build.outputs.tag }}
        run: |
          set -euo pipefail
          PYTHONPATH=spikes/supply-chain/scripts python3 - \
            "$RUNNER_TEMP/task008d-zot-handoff" "$GITHUB_SHA" "$BASELINE_TAG" <<'PY'
          import sys
          from pathlib import Path
          from zot_oci_common import validate_handoff
          validate_handoff(Path(sys.argv[1]), sys.argv[2], sys.argv[3])
          PY
      - name: Request independent read-only GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          token_file="$RUNNER_TEMP/task008d-zot-consumer.jwt"
          encoded_audience="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$ZOT_AUDIENCE")"
          response="$(curl --fail --show-error --silent --proto '=https' --tlsv1.2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}")"
          token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$response")"
          echo "::add-mask::$token"; printf '%s' "$token" > "$token_file"; chmod 0600 "$token_file"
          printf 'token_file=%s\n' "$token_file" >> "$GITHUB_OUTPUT"
      - name: Verify retained baseline with read-only direct Bearer client
        shell: bash
        env:
          BASELINE_TAG: ${{ needs.fixture-build.outputs.tag }}
        run: |
          set -euo pipefail
          python3 spikes/supply-chain/scripts/zot_consumer_probe.py \
            --registry "$ZOT_REGISTRY" --token-file "${{ steps.oidc.outputs.token_file }}" \
            --handoff "$RUNNER_TEMP/task008d-zot-handoff" \
            --source-commit "$GITHUB_SHA" --tag "$BASELINE_TAG" --summary "$GITHUB_STEP_SUMMARY"
      - name: Verify standard Docker pull compatibility without execution
        shell: bash
        env:
          BASELINE_TAG: ${{ needs.fixture-build.outputs.tag }}
        run: |
          set -euo pipefail
          umask 077
          docker_config="$RUNNER_TEMP/task008d-consumer-docker"; token_file="$RUNNER_TEMP/task008d-consumer-docker.jwt"
          mkdir "$docker_config"; logged_in=false
          cleanup() { if [[ "$logged_in" == true ]]; then DOCKER_CONFIG="$docker_config" docker logout oci-dev.omnilyzer.ai || true; fi; rm -f -- "$token_file"; }
          trap cleanup EXIT
          encoded_audience="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$ZOT_AUDIENCE")"
          response="$(curl --fail --show-error --silent --proto '=https' --tlsv1.2 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}")"
          token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$response")"
          echo "::add-mask::$token"; printf '%s' "$token" > "$token_file"; chmod 0600 "$token_file"
          DOCKER_CONFIG="$docker_config" docker login oci-dev.omnilyzer.ai --username oidc --password-stdin < "$token_file"; logged_in=true
          digest="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["baseline"]["manifest_digest"])' "$RUNNER_TEMP/task008d-zot-handoff/handoff.json")"
          DOCKER_CONFIG="$docker_config" docker pull "oci-dev.omnilyzer.ai/omnilyzer/task008d-supply-chain-spike:${BASELINE_TAG}"
          DOCKER_CONFIG="$docker_config" docker pull "oci-dev.omnilyzer.ai/omnilyzer/task008d-supply-chain-spike@${digest}"
          printf '| Standard Docker + OIDC token service | PASS |\n' >> "$GITHUB_STEP_SUMMARY"
