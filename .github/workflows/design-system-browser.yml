# File: .github/workflows/design-system-browser.yml
# Purpose: Validates the design-system spike in real Chromium on its accepted Node 24 runtime.
# Related: spikes/design-system/playwright.config.ts, spikes/design-system/package.json

name: Design-system browser validation

on:
  push:
    branches:
      - main
    paths:
      - "spikes/design-system/**"
      - ".github/workflows/design-system-browser.yml"
  pull_request:
    paths:
      - "spikes/design-system/**"
      - ".github/workflows/design-system-browser.yml"

permissions:
  contents: read

jobs:
  browser-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: spikes/design-system
    steps:
      - name: Check out repository without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up accepted Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: spikes/design-system/package-lock.json

      - name: Install pinned npm dependencies
        run: npm ci

      - name: Run deterministic design-system validation
        run: npm run validate

      - name: Install Playwright Chromium and runner dependencies
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run real-browser accessibility and interaction validation
        run: npm run test:browser
