# File: .github/workflows/platform-release.yml
# Purpose: Preserve the original protected canary release and add a separate
#          Analytics OCI-only Task013 signing/publication path, after pinned
#          Syft/Grype scanning and authenticated registry absence checks.
# Related: release/registry_absence_preflight.py, release/request_oidc.py,
#          release/analytics_publish_zot.py, release/analytics_release_evidence.py,
#          release/analytics_forgejo_evidence.py, release/tests/test_workflow_policy.py.
# Authority: Both product paths require the protected main SHA and original
#            environment. Diagnostic mode remains read-only; Task014 unchanged.

name: Platform release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Coordinated platform version (strict X.Y.Z)
        required: true
        type: string
      source_sha:
        description: Exact 40-character commit SHA selected from main
        required: true
        type: string
      auth_probe:
        description: Read-only Forgejo OIDC diagnostic, skips build and publication
        required: false
        type: boolean
        default: false
      product:
        description: Canary or signed Analytics Task013 release
        required: false
        type: choice
        options:
          - canary
          - analytics
        default: canary

permissions: {}

concurrency:
  group: platform-release-${{ github.event.inputs.product }}-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  # Section 0: an API-dispatched unknown product or Analytics auth-probe mode
  # must produce a FAILED run, not a deceptively green all-skipped workflow.
  deny-unsupported-dispatch:
    if: ${{ (inputs.product != 'canary' && inputs.product != 'analytics') || (inputs.product == 'analytics' && inputs.auth_probe == true) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Fail closed on unsupported release dispatch
        shell: bash
        run: |
          echo "Unsupported product or incompatible diagnostic mode" >&2
          exit 1

  # Section 1: A selected OIDC probe runs under THIS exact workflow_ref on main.
  # No dependency path to gate, build, or a publisher exists in diagnostic mode.
  forgejo-auth-probe:
    if: ${{ inputs.auth_probe == true && inputs.product == 'canary' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: task013-dev-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out exact dispatched source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate the approved source and workflow identity before requesting OIDC
        shell: bash
        env:
          REQUESTED_SHA: ${{ github.event.inputs.source_sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          test "$SOURCE_REPOSITORY" = "MichaelTrueX/omnilyzer-platform"
          test "$SOURCE_REF" = "refs/heads/main"
          test "$REQUESTED_SHA" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$SOURCE_WORKFLOW_REF" = "MichaelTrueX/omnilyzer-platform/.github/workflows/platform-release.yml@refs/heads/main"
      - name: Verify Forgejo OIDC through one fixed read-only package GET
        shell: bash
        run: |
          set -euo pipefail
          token_file="$RUNNER_TEMP/forgejo-readonly-oidc.jwt"
          trap 'rm -f "$token_file"' EXIT
          python3 -m release.request_oidc \
            --audience u:2:316bec9a-53e4-4807-9557-7febdc979d0a \
            --output "$token_file"
          python3 -m release.forgejo_oidc_probe --token-file "$token_file"

  # Section 1b: independently verify the exact Analytics source INSIDE the
  # existing protected workflow, without granting publication or promotion.
  # This read-only path is intentionally NOT the signed product release job:
  # existing canary publishers remain separate; Analytics publishers require
  # the completed scanner job and the same protected release environment.
  analytics-source-admission:
    if: ${{ inputs.product == 'analytics' && inputs.auth_probe == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out exact protected original platform source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require read-only Analytics Git deploy key
        shell: bash
        env:
          ANALYTICS_DEPLOY_KEY: ${{ secrets.ANALYTICS_SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if test -z "$ANALYTICS_DEPLOY_KEY"; then
            echo 'TASK013_ANALYTICS_PRIVATE_DEPLOY_KEY_MISSING' >&2
            exit 1
          fi
      - name: Check out exact reviewed Analytics PR52 Git objects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MichaelTrueX/omnilyzer
          ref: 4cdda7faeba57abb3388f9be5c450fe6afb1140d
          # Cross-repository private checkout needs its own least-privilege
          # read-only credential; platform GITHUB_TOKEN cannot access it.
          ssh-key: ${{ secrets.ANALYTICS_SOURCE_DEPLOY_KEY }}
          fetch-depth: 0
          path: analytics-review-source
          persist-credentials: false
      - name: Enforce protected main, immutable Git revision, and strict source binding
        shell: bash
        env:
          DISPATCH_REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          REQUESTED_SHA: ${{ github.event.inputs.source_sha }}
          RELEASE_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REPOSITORY" = "MichaelTrueX/omnilyzer-platform"
          test "$DISPATCH_REF" = "refs/heads/main"
          test "$REQUESTED_SHA" = "$DISPATCH_SHA"
          test "$(git rev-parse HEAD)" = "$DISPATCH_SHA"
          test "$RELEASE_WORKFLOW_REF" = "MichaelTrueX/omnilyzer-platform/.github/workflows/platform-release.yml@refs/heads/main"
          test "$(git -C analytics-review-source rev-parse HEAD)" = "4cdda7faeba57abb3388f9be5c450fe6afb1140d"
          git -C analytics-review-source remote set-url origin https://github.com/MichaelTrueX/omnilyzer.git
          python3 -m release.analytics_source_admission --analytics-checkout analytics-review-source
          python3 -m release.analytics_task013_build_input --analytics-checkout analytics-review-source
          echo "ANALYTICS_SOURCE_ONLY_ACCEPTED: NO SIGNATURE, NO REGISTRY, NO EXECUTOR"
      # Section 1c: original Task013 pinned build and scanner; all outputs
      # remain LOCAL, unsigned, and inaccessible to the canary publishers.
      - name: Set up pinned Analytics Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Set up original pinned Analytics Buildx and BuildKit
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          name: m01-analytics-task013
          version: v0.36.1
          driver: docker-container
          driver-opts: image=moby/buildkit:v0.24.0@sha256:6eceb8971ce4fceb3daca562832642706238b7eea72941fcf9896c93c3c4a53e
      - name: Build and verify immutable original Analytics OCI archive
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          handoff="$RUNNER_TEMP/analytics-task013-unsigned"
          mkdir -m 0700 "$handoff"
          python3 -m release.analytics_task013_build_candidate \
            --analytics-checkout analytics-review-source \
            --builder m01-analytics-task013 --build \
            --retain-verified-artifacts "$handoff/candidate"
          test -s "$handoff/candidate/source.tar"
          test -s "$handoff/candidate/analytics.oci.tar"
          python3 -m release.analytics_release_source_binding \
            --analytics-checkout analytics-review-source \
            --immutable-context "$handoff/candidate/source.tar" \
            --oci-archive "$handoff/candidate/analytics.oci.tar" \
            > "$handoff/unsigned-source-claim.json"
          python3 - "$handoff/unsigned-source-claim.json" <<'PYCODE'
          import json, sys
          from pathlib import Path
          receipt = json.loads(Path(sys.argv[1]).read_bytes())
          if (receipt.get('signed') is not False
                  or receipt.get('release_authorized') is not False
                  or receipt.get('deployment_authorized') is not False
                  or receipt.get('claim', {}).get('source_files_verified') != 78
                  or receipt.get('claim', {}).get('source_commit') !=
                  '4cdda7faeba57abb3388f9be5c450fe6afb1140d'):
              raise SystemExit('ORIGINAL_ANALYTICS_SOURCE_CLAIM_DENIED')
          print('ORIGINAL_ANALYTICS_UNSIGNED_SOURCE_BINDING_PASS')
          PYCODE
      - name: Install original pinned Analytics Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.22.2
        with:
          syft-version: v1.51.0
      - name: Install original pinned Analytics Grype
        id: analytics-grype
        uses: anchore/scan-action/download-grype@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.3.0
        with:
          grype-version: v0.118.0
      - name: Scan exact Analytics OCI and enforce original Critical High policy
        shell: bash
        env:
          GRYPE_COMMAND: ${{ steps.analytics-grype.outputs.cmd }}
        run: |
          set -euo pipefail
          handoff="$RUNNER_TEMP/analytics-task013-unsigned"
          oci="$handoff/candidate/analytics.oci.tar"
          test -s "$oci"
          test -x "$GRYPE_COMMAND"
          "$GRYPE_COMMAND" version | python3 -c \
            'import re,sys; v=re.findall(r"(?im)^version:\s*v?([^\s]+)\s*$",sys.stdin.read());sys.exit(0 if v==["0.118.0"] else 1)'
          syft scan "oci-archive:$oci" \
            -o "cyclonedx-json@1.6=$handoff/oci-sbom.cdx.json"
          "$GRYPE_COMMAND" "sbom:$handoff/oci-sbom.cdx.json" -o json > "$handoff/oci-grype.json"
          "$GRYPE_COMMAND" db status -o json > "$handoff/grype-db-status.raw.json"
          python3 -m release.vulnerability_policy sanitize-db \
            "$handoff/grype-db-status.raw.json" "$handoff/grype-db-status.json"
          rm -f "$handoff/grype-db-status.raw.json"
          # This is the existing original policy evaluator applied to the
          # actual OCI Grype report. No fictitious Python/npm reports are used.
          python3 - "$handoff/oci-grype.json" "$handoff/grype-db-status.json" <<'PYCODE'
          import datetime as dt
          import json
          import sys
          from pathlib import Path
          from release.vulnerability_policy import (
              evaluate, validate_database_status, validate_policy,
          )
          scanner = Path(sys.argv[1])
          status = Path(sys.argv[2])
          if not validate_database_status(json.loads(status.read_bytes()))['valid']:
              raise SystemExit('ORIGINAL_ANALYTICS_GRYPE_DATABASE_DENIED')
          policy_path = Path('release/vulnerability-policy.json')
          policy = validate_policy(json.loads(policy_path.read_bytes()), dt.date.today())
          if policy['exceptions'] != []:
              raise SystemExit('ORIGINAL_ANALYTICS_SECURITY_WAIVER_DENIED')
          receipt = evaluate(policy_path, {'oci': scanner}, dt.date.today())
          if receipt['decision'] != 'PASS' or receipt['blocked_findings']:
              raise SystemExit('ORIGINAL_ANALYTICS_CRITICAL_HIGH_POLICY_DENIED')
          print('ORIGINAL_ANALYTICS_REAL_OCI_SYFT_GRYPE_POLICY_PASS_NO_WAIVERS')
          PYCODE
          # This job grants no signing or registry authority; the separate
          # protected Analytics jobs require its completed scanner handoff.

      - name: Retain verified Analytics release handoff for protected publication
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          handoff="$RUNNER_TEMP/analytics-task013-unsigned"
          cp release/vulnerability-policy.json "$handoff/vulnerability-policy.json"
          python3 - "$handoff/unsigned-source-claim.json" "$handoff/analytics-source-claim.json" <<'PYCODE'
          import json,sys
          from pathlib import Path
          from deployment.policy import canonical_bytes
          value=json.loads(Path(sys.argv[1]).read_bytes())
          claim=value['claim']
          if value.get('signed') is not False or claim.get('oci_repository')!='omnilyzer/analytics':
              raise SystemExit('ANALYTICS_HANDOFF_REJECTED')
          Path(sys.argv[2]).write_bytes(canonical_bytes(claim))
          PYCODE
      - name: Encrypt private Analytics source and OCI BEFORE public artifact transport
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -m release.analytics_private_handoff encrypt \
            "$RUNNER_TEMP/analytics-task013-unsigned" \
            "$RUNNER_TEMP/analytics-task013-transport.gpg"
          test -s "$RUNNER_TEMP/analytics-task013-transport.gpg"
          rm -rf -- "$RUNNER_TEMP/analytics-task013-unsigned"
      - name: Upload encrypted Analytics handoff ONLY
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: analytics-task013-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/analytics-task013-transport.gpg
          if-no-files-found: error
          retention-days: 1

  # Section 1d: isolated protected Analytics OCI publisher. Canary unchanged.
  analytics-publish-zot:
    needs: [analytics-source-admission]
    if: ${{ inputs.product == 'analytics' && inputs.auth_probe == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: task013-dev-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout protected platform source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require read-only Analytics Git deploy key
        shell: bash
        env:
          ANALYTICS_DEPLOY_KEY: ${{ secrets.ANALYTICS_SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if test -z "$ANALYTICS_DEPLOY_KEY"; then
            echo 'TASK013_ANALYTICS_PRIVATE_DEPLOY_KEY_MISSING' >&2
            exit 1
          fi
      - name: Checkout reviewed immutable Analytics Git source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MichaelTrueX/omnilyzer
          ref: 4cdda7faeba57abb3388f9be5c450fe6afb1140d
          # Cross-repository private checkout needs its own least-privilege
          # read-only credential; platform GITHUB_TOKEN cannot access it.
          ssh-key: ${{ secrets.ANALYTICS_SOURCE_DEPLOY_KEY }}
          fetch-depth: 0
          path: analytics-review-source
          persist-credentials: false
      - name: Download scanner-approved OCI handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: analytics-task013-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/analytics-task013-transport
      - name: Decrypt private handoff INSIDE protected release publisher
        shell: bash
        env:
          ANALYTICS_HANDOFF_PRIVATE_KEY: ${{ secrets.ANALYTICS_HANDOFF_DECRYPT_KEY }}
        run: |
          set -euo pipefail
          umask 077
          python3 -m release.analytics_private_handoff decrypt \
            "$RUNNER_TEMP/analytics-task013-transport/analytics-task013-transport.gpg" \
            "$RUNNER_TEMP/analytics-task013-handoff"
          test -s "$RUNNER_TEMP/analytics-task013-handoff/candidate/source.tar"
          test -s "$RUNNER_TEMP/analytics-task013-handoff/candidate/analytics.oci.tar"
      - name: Verify source, registry absence, then publish exact OCI digest
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          umask 077
          test "$RELEASE_REF" = refs/heads/main
          test "$RELEASE_REPOSITORY" = MichaelTrueX/omnilyzer-platform
          test "$REQUESTED_SHA" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          handoff="$RUNNER_TEMP/analytics-task013-handoff"
          forgejo_token="$RUNNER_TEMP/analytics-preflight-forgejo.jwt"
          zot_token="$RUNNER_TEMP/analytics-preflight-zot.jwt"
          publish_token="$RUNNER_TEMP/analytics-zot-publish.jwt"
          trap 'rm -f "$forgejo_token" "$zot_token" "$publish_token"' EXIT
          python3 -m release.analytics_release_source_binding \
            --analytics-checkout analytics-review-source \
            --immutable-context "$handoff/candidate/source.tar" \
            --oci-archive "$handoff/candidate/analytics.oci.tar" \
            > "$RUNNER_TEMP/analytics-reverified.json"
          python3 - "$handoff/analytics-source-claim.json" "$RUNNER_TEMP/analytics-reverified.json" <<'PYCODE'
          import json,sys
          from pathlib import Path
          if json.loads(Path(sys.argv[1]).read_bytes()) != json.loads(Path(sys.argv[2]).read_bytes())['claim']:
              raise SystemExit('ANALYTICS_SOURCE_BINDING_TRANSPORT_DENIED')
          PYCODE
          python3 -m release.request_oidc --audience u:2:316bec9a-53e4-4807-9557-7febdc979d0a --output "$forgejo_token"
          python3 -m release.request_oidc --audience https://oci-dev.omnilyzer.ai --output "$zot_token"
          python3 -m release.registry_absence_preflight --product analytics \
            --version "$RELEASE_VERSION" --forgejo-token-file "$forgejo_token" \
            --zot-token-file "$zot_token"
          python3 -m release.request_oidc --audience https://oci-dev.omnilyzer.ai --output "$publish_token"
          python3 -m release.analytics_publish_zot \
            --analytics-checkout analytics-review-source \
            --immutable-context "$handoff/candidate/source.tar" \
            --oci-archive "$handoff/candidate/analytics.oci.tar" \
            --token-file "$publish_token" --version "$RELEASE_VERSION" \
            --output "$RUNNER_TEMP/analytics-oci-publication.json"
      - name: Upload authenticated Analytics Zot publication receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: analytics-task013-zot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/analytics-oci-publication.json
          if-no-files-found: error
          retention-days: 1

  # Section 1e: protected Analytics keyless Cosign and Forgejo publication.
  analytics-publish-forgejo:
    needs: [analytics-source-admission, analytics-publish-zot]
    if: ${{ inputs.product == 'analytics' && inputs.auth_probe == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: task013-dev-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout protected platform source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download scanner-approved Analytics handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: analytics-task013-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/analytics-task013-transport
      - name: Decrypt private handoff INSIDE protected release publisher
        shell: bash
        env:
          ANALYTICS_HANDOFF_PRIVATE_KEY: ${{ secrets.ANALYTICS_HANDOFF_DECRYPT_KEY }}
        run: |
          set -euo pipefail
          umask 077
          python3 -m release.analytics_private_handoff decrypt \
            "$RUNNER_TEMP/analytics-task013-transport/analytics-task013-transport.gpg" \
            "$RUNNER_TEMP/analytics-task013-handoff"
          test -s "$RUNNER_TEMP/analytics-task013-handoff/candidate/source.tar"
          test -s "$RUNNER_TEMP/analytics-task013-handoff/candidate/analytics.oci.tar"
      - name: Download authenticated Analytics Zot receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: analytics-task013-zot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/analytics-zot-receipt
      - name: Enforce protected identity and build exact Analytics evidence
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REPOSITORY_ID: ${{ github.repository_id }}
          RELEASE_WORKFLOW_REF: ${{ github.workflow_ref }}
          RELEASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          umask 077
          test "$RELEASE_REF" = refs/heads/main
          test "$RELEASE_REPOSITORY" = MichaelTrueX/omnilyzer-platform
          test "$REQUESTED_SHA" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$RELEASE_WORKFLOW_SHA" = "$RELEASE_SHA"
          test "$RELEASE_WORKFLOW_REF" = 'MichaelTrueX/omnilyzer-platform/.github/workflows/platform-release.yml@refs/heads/main'
          python3 -m release.analytics_release_evidence \
            --source-claim "$RUNNER_TEMP/analytics-task013-handoff/analytics-source-claim.json" \
            --publication "$RUNNER_TEMP/analytics-zot-receipt/analytics-oci-publication.json" \
            --scan-dir "$RUNNER_TEMP/analytics-task013-handoff" \
            --output "$RUNNER_TEMP/analytics-release-evidence" \
            --version "$RELEASE_VERSION" --repository "$RELEASE_REPOSITORY" \
            --repository-id "$RELEASE_REPOSITORY_ID" \
            --workflow-ref "$RELEASE_WORKFLOW_REF" \
            --workflow-sha "$RELEASE_WORKFLOW_SHA" \
            --run-id "$RELEASE_RUN_ID" --run-attempt "$RELEASE_RUN_ATTEMPT" \
            --event-name "$RELEASE_EVENT_NAME" --source-commit "$RELEASE_SHA"
      - name: Install original pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.0
        with:
          cosign-release: v3.1.2
      - name: Sign and cryptographically verify Analytics manifest provenance and OCI
        shell: bash
        env:
          CERTIFICATE_IDENTITY: https://github.com/MichaelTrueX/omnilyzer-platform/.github/workflows/platform-release.yml@refs/heads/main
          CERTIFICATE_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          umask 077
          evidence="$RUNNER_TEMP/analytics-release-evidence"
          for name in release-manifest release-provenance; do
            cosign sign-blob --yes --bundle "$evidence/$name.sigstore.json" "$evidence/$name.json"
            cosign verify-blob --bundle "$evidence/$name.sigstore.json" \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer "$CERTIFICATE_ISSUER" "$evidence/$name.json"
          done
          digest="$(python3 - "$evidence/oci-publication.json" <<'PYCODE'
          import json,sys
          print(json.load(open(sys.argv[1]))['manifest_digest'])
          PYCODE
          )"
          token_file="$RUNNER_TEMP/analytics-zot-sign.jwt"
          docker_config="$RUNNER_TEMP/analytics-docker"
          mkdir -m 0700 "$docker_config"
          export DOCKER_CONFIG="$docker_config"
          trap 'rm -f "$token_file"; docker --config "$docker_config" logout oci-dev.omnilyzer.ai >/dev/null 2>&1 || true; rm -rf "$docker_config"' EXIT
          python3 -m release.request_oidc --audience https://oci-dev.omnilyzer.ai --output "$token_file"
          docker --config "$docker_config" login oci-dev.omnilyzer.ai --username oidc --password-stdin < "$token_file"
          rm -f "$token_file"
          cosign sign --yes "oci-dev.omnilyzer.ai/omnilyzer/analytics@$digest"
          cosign verify --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$CERTIFICATE_ISSUER" \
            "oci-dev.omnilyzer.ai/omnilyzer/analytics@$digest"
      - name: Publish signed Analytics evidence to original Forgejo Generic registry
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          token_file="$RUNNER_TEMP/analytics-forgejo.jwt"
          trap 'rm -f "$token_file"' EXIT
          python3 -m release.request_oidc --audience u:2:316bec9a-53e4-4807-9557-7febdc979d0a --output "$token_file"
          digest="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["manifest_digest"])' "$RUNNER_TEMP/analytics-release-evidence/oci-publication.json")"
          python3 -m release.analytics_forgejo_evidence \
            --evidence "$RUNNER_TEMP/analytics-release-evidence" \
            --token-file "$token_file" --oci-digest "$digest" --version "$RELEASE_VERSION"

      - name: Warn about immutable partial Analytics release on downstream failure
        if: failure()
        shell: bash
        run: |
          # This is a warning, NOT cleanup, waiver, a retry, or Task014 admission.
          # The prior Zot job might already have committed an immutable tag.
          echo '::warning title=Analytics Task013 partial-release HOLD::Zot may contain an occupied immutable OCI tag without verified Cosign and Forgejo evidence. Do not deploy, retry the same version, delete automatically, or bypass the preflight. Follow docs/operations/m05-13-analytics-partial-release-recovery-20261029.md.'
          echo 'Analytics Task013 HOLD: independently verify Zot tag/digest, signed bundles and Forgejo evidence before any Task014 admission.' >> "$GITHUB_STEP_SUMMARY"

  # Section 2: Release gate runs only in the DEFAULT non-diagnostic mode.
  gate:
    if: ${{ inputs.auth_probe == false && inputs.product == 'canary' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publishing_enabled: ${{ steps.policy.outputs.publishing_enabled }}
    steps:
      - name: Check out exact dispatched source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Enforce repository, main ref, source SHA, plan, and environment
        id: policy
        shell: bash
        env:
          DISPATCH_REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          REQUESTED_SHA: ${{ github.event.inputs.source_sha }}
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REPOSITORY" = "MichaelTrueX/omnilyzer-platform"
          test "$DISPATCH_REF" = "refs/heads/main"
          test "$REQUESTED_SHA" = "$DISPATCH_SHA"
          test "$(git rev-parse HEAD)" = "$DISPATCH_SHA"
          python3 -m release.release_plan materialize \
            release/fixtures/task013-canary/release-plan-template.json \
            "$RELEASE_VERSION" "$DISPATCH_SHA" "$RUNNER_TEMP/release-plan.json" \
            --repository "$GITHUB_WORKSPACE"
          publishing_enabled="$(python3 -m release.release_plan validate-environment release/environments/dev.json)"
          printf 'publishing_enabled=%s\n' "$publishing_enabled" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out exact dispatched source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Materialize plan and build package artifacts once
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          handoff="$RUNNER_TEMP/platform-release-handoff"
          mkdir -m 0700 "$handoff"
          python3 -m release.release_plan materialize \
            release/fixtures/task013-canary/release-plan-template.json \
            "$RELEASE_VERSION" "$SOURCE_SHA" "$RUNNER_TEMP/release-plan.json" \
            --repository "$GITHUB_WORKSPACE"
          python3 -m release.build_release packages \
            --plan "$RUNNER_TEMP/release-plan.json" --output "$handoff" \
            --repository "$GITHUB_WORKSPACE"
      - name: Set up pinned Buildx and BuildKit
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          version: v0.36.1
          driver: docker-container
          driver-opts: image=moby/buildkit:v0.24.0@sha256:6eceb8971ce4fceb3daca562832642706238b7eea72941fcf9896c93c3c4a53e
      - name: Verify pinned image builder versions
        shell: bash
        run: |
          set -euo pipefail
          buildx_output="$(docker buildx version)"
          printf '%s\n' "$buildx_output"
          printf '%s\n' "$buildx_output" | python3 -m release.builder_versions buildx
          buildkit_output="$(docker buildx inspect --bootstrap)"
          printf '%s\n' "$buildkit_output"
          printf '%s\n' "$buildkit_output" | python3 -m release.builder_versions buildkit
      - name: Build executable OCI canary exactly once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: release/fixtures/task013-canary/oci
          file: release/fixtures/task013-canary/oci/Dockerfile
          platforms: linux/amd64
          pull: true
          no-cache: true
          network: none
          push: false
          load: false
          provenance: false
          sbom: false
          build-args: |
            RELEASE_VERSION=${{ github.event.inputs.version }}
            SOURCE_SHA=${{ github.sha }}
            OCI_REPOSITORY=omnilyzer/task013-release-canary
          outputs: type=oci,dest=${{ runner.temp }}/platform-release-handoff/task013-release-canary-${{ github.event.inputs.version }}.oci.tar
      - name: Validate executable OCI contract and exact manifest digest
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -m release.executable_oci \
            --archive "$RUNNER_TEMP/platform-release-handoff/task013-release-canary-$RELEASE_VERSION.oci.tar" \
            --release-version "$RELEASE_VERSION" --source-sha "$SOURCE_SHA" \
            --repository omnilyzer/task013-release-canary
      - name: Install pinned Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.22.2
        with:
          syft-version: v1.51.0
      - name: Install pinned Grype
        id: grype
        uses: anchore/scan-action/download-grype@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.3.0
        with:
          grype-version: v0.118.0
      - name: Generate CycloneDX 1.6 SBOM and Grype evidence
        shell: bash
        env:
          GRYPE_COMMAND: ${{ steps.grype.outputs.cmd }}
        run: |
          set -euo pipefail
          test -x "$GRYPE_COMMAND"
          grype_version="$({ "$GRYPE_COMMAND" version; } 2>&1)"
          python3 -c \
            'import re, sys; text = sys.stdin.read(); versions = re.findall(r"(?im)^version:\s*v?([^\s]+)\s*$", text); raise SystemExit(0 if versions == ["0.118.0"] else "unexpected Grype version")' \
            <<< "$grype_version"
          handoff="$RUNNER_TEMP/platform-release-handoff"
          wheel="$(find "$handoff" -maxdepth 1 -type f -name '*.whl' -print)"
          npm_tarball="$(find "$handoff" -maxdepth 1 -type f -name '*.tgz' -print)"
          oci_archive="$(find "$handoff" -maxdepth 1 -type f -name '*.oci.tar' -print)"
          test -n "$wheel" && test -n "$npm_tarball" && test -n "$oci_archive"
          python3 -m release.prepare_scan_roots --wheel "$wheel" --npm "$npm_tarball" \
            --output "$RUNNER_TEMP/task013-scan-roots"
          syft scan "dir:$RUNNER_TEMP/task013-scan-roots/python" \
            -o "cyclonedx-json@1.6=$handoff/python-sbom.cdx.json"
          syft scan "dir:$RUNNER_TEMP/task013-scan-roots/npm" \
            -o "cyclonedx-json@1.6=$handoff/npm-sbom.cdx.json"
          syft scan "oci-archive:$oci_archive" -o "cyclonedx-json@1.6=$handoff/oci-sbom.cdx.json"
          "$GRYPE_COMMAND" "sbom:$handoff/python-sbom.cdx.json" -o json > "$handoff/python-grype.json"
          "$GRYPE_COMMAND" "sbom:$handoff/npm-sbom.cdx.json" -o json > "$handoff/npm-grype.json"
          "$GRYPE_COMMAND" "sbom:$handoff/oci-sbom.cdx.json" -o json > "$handoff/oci-grype.json"
          "$GRYPE_COMMAND" db status -o json > "$RUNNER_TEMP/grype-db-status.raw.json"
          python3 -m release.vulnerability_policy sanitize-db \
            "$RUNNER_TEMP/grype-db-status.raw.json" "$handoff/grype-db-status.json"
          rm -f "$RUNNER_TEMP/grype-db-status.raw.json"
      - name: Prepare denied-release diagnostic evidence
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -m release.denial_evidence \
            --handoff "$RUNNER_TEMP/platform-release-handoff" \
            --policy release/vulnerability-policy.json \
            --output "$RUNNER_TEMP/platform-release-denial-evidence" \
            --repository "$GITHUB_WORKSPACE" \
            --expected-version "$RELEASE_VERSION" --expected-sha "$SOURCE_SHA"
      - name: Apply fail-closed vulnerability policy
        id: vulnerability_policy
        shell: bash
        run: |
          set -euo pipefail
          denial="$RUNNER_TEMP/platform-release-denial-evidence"
          python3 -m release.vulnerability_policy \
            --policy "$denial/vulnerability-policy.json" \
            --python "$denial/python-grype.json" \
            --npm "$denial/npm-grype.json" \
            --oci "$denial/oci-grype.json" \
            --evaluation-date "$(date -u +%F)" \
            --output "$denial/vulnerability-policy-result.json"
      - name: Upload denied-release diagnostic evidence
        if: always() && steps.vulnerability_policy.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: platform-release-denial-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-release-denial-evidence
          if-no-files-found: error
          retention-days: 30
      - name: Finalize and verify immutable handoff
        if: steps.vulnerability_policy.outcome == 'success'
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          handoff="$RUNNER_TEMP/platform-release-handoff"
          denial="$RUNNER_TEMP/platform-release-denial-evidence"
          cp "$denial/vulnerability-policy.json" "$handoff/vulnerability-policy.json"
          cp "$denial/vulnerability-policy-result.json" "$handoff/vulnerability-policy-result.json"
          python3 -m release.build_release finalize --handoff "$handoff" \
            --repository "$GITHUB_WORKSPACE" --evidence-mode production-tools
          python3 -m release.verify_handoff --handoff "$handoff" \
            --repository "$GITHUB_WORKSPACE" --expected-version "$RELEASE_VERSION" \
            --expected-sha "$SOURCE_SHA" --require-production-evidence
      - name: Upload immutable build handoff for transport only
        if: success() && steps.vulnerability_policy.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: platform-release-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-release-handoff
          if-no-files-found: error
          retention-days: 1

  publish-zot:
    needs: [gate, build]
    if: needs.gate.outputs.publishing_enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: task013-dev-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out exact dispatched source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download immutable build handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-release-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-release-handoff
      - name: Verify complete handoff before requesting OIDC
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -m release.verify_handoff \
            --handoff "$RUNNER_TEMP/platform-release-handoff" \
            --repository "$GITHUB_WORKSPACE" --expected-version "$RELEASE_VERSION" \
            --expected-sha "$SOURCE_SHA" --require-production-evidence
      # Section: pre-publication absent-version proof. No writes until this
      # job authenticates to BOTH registries and confirms all four are unused.
      - name: Verify unused version on both registries before publication
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          umask 077
          forgejo_token="$RUNNER_TEMP/task013-preflight-forgejo.jwt"
          zot_token="$RUNNER_TEMP/task013-preflight-zot.jwt"
          trap 'rm -f "$forgejo_token" "$zot_token"' EXIT
          python3 -m release.request_oidc \
            --audience u:2:316bec9a-53e4-4807-9557-7febdc979d0a \
            --output "$forgejo_token"
          python3 -m release.request_oidc \
            --audience https://oci-dev.omnilyzer.ai \
            --output "$zot_token"
          python3 -m release.registry_absence_preflight \
            --version "$RELEASE_VERSION" \
            --forgejo-token-file "$forgejo_token" \
            --zot-token-file "$zot_token"
      - name: Request short-lived zot OIDC and publish prebuilt OCI
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          token_file="$RUNNER_TEMP/task013-zot.jwt"
          trap 'rm -f "$token_file"' EXIT
          python3 -m release.request_oidc --audience https://oci-dev.omnilyzer.ai --output "$token_file"
          python3 -m release.publish_zot \
            --handoff "$RUNNER_TEMP/platform-release-handoff" --token-file "$token_file" \
            --output "$RUNNER_TEMP/oci-publication.json" --repository "$GITHUB_WORKSPACE" \
            --version "$RELEASE_VERSION" --source-sha "$SOURCE_SHA"
      - name: Upload immutable OCI publication result for transport only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: platform-release-oci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oci-publication.json
          if-no-files-found: error
          retention-days: 1

  publish-forgejo:
    needs: [gate, build, publish-zot]
    if: needs.gate.outputs.publishing_enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: task013-dev-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out exact dispatched source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download immutable build handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-release-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-release-handoff
      - name: Download immutable zot publication result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-release-oci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zot-result
      - name: Verify complete handoff before requesting OIDC
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_REPOSITORY_ID: ${{ github.repository_id }}
          RELEASE_WORKFLOW_REF: ${{ github.workflow_ref }}
          RELEASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 -m release.verify_handoff \
            --handoff "$RUNNER_TEMP/platform-release-handoff" \
            --repository "$GITHUB_WORKSPACE" --expected-version "$RELEASE_VERSION" \
            --expected-sha "$SOURCE_SHA" --require-production-evidence
          python3 -m release.provenance \
            --handoff "$RUNNER_TEMP/platform-release-handoff" \
            --oci-publication "$RUNNER_TEMP/zot-result/oci-publication.json" \
            --output "$RUNNER_TEMP/platform-release-evidence" \
            --repository "$GITHUB_WORKSPACE" --version "$RELEASE_VERSION" \
            --source-sha "$SOURCE_SHA" \
            --github-repository "$RELEASE_REPOSITORY" \
            --github-repository-id "$RELEASE_REPOSITORY_ID" \
            --github-workflow-ref "$RELEASE_WORKFLOW_REF" \
            --github-workflow-sha "$RELEASE_WORKFLOW_SHA" \
            --github-run-id "$RELEASE_RUN_ID" \
            --github-run-attempt "$RELEASE_RUN_ATTEMPT" \
            --github-event-name "$RELEASE_EVENT_NAME"
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.0
        with:
          cosign-release: v3.1.2
      - name: Create keyless signed release evidence
        shell: bash
        env:
          OCI_REPOSITORY: omnilyzer/task013-release-canary
          CERTIFICATE_IDENTITY: https://github.com/MichaelTrueX/omnilyzer-platform/.github/workflows/platform-release.yml@refs/heads/main
          CERTIFICATE_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/platform-release-evidence"
          cosign sign-blob --yes --bundle "$evidence/release-manifest.sigstore.json" \
            "$evidence/release-manifest.json"
          cosign sign-blob --yes --bundle "$evidence/release-provenance.sigstore.json" \
            "$evidence/release-provenance.json"
          cosign verify-blob --bundle "$evidence/release-manifest.sigstore.json" \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$CERTIFICATE_ISSUER" \
            "$evidence/release-manifest.json"
          cosign verify-blob --bundle "$evidence/release-provenance.sigstore.json" \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$CERTIFICATE_ISSUER" \
            "$evidence/release-provenance.json"
          digest="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["manifest_digest"])' "$RUNNER_TEMP/zot-result/oci-publication.json")"
          token_file="$RUNNER_TEMP/task013-zot-sign.jwt"
          docker_config="$RUNNER_TEMP/task013-docker"
          mkdir -m 0700 "$docker_config"
          export DOCKER_CONFIG="$docker_config"
          trap 'rm -f "$token_file"; docker --config "$docker_config" logout oci-dev.omnilyzer.ai >/dev/null 2>&1 || true; rm -rf "$docker_config"' EXIT
          python3 -m release.request_oidc --audience https://oci-dev.omnilyzer.ai --output "$token_file"
          docker --config "$docker_config" login oci-dev.omnilyzer.ai --username oidc --password-stdin < "$token_file"
          rm -f "$token_file"
          cosign sign --yes "oci-dev.omnilyzer.ai/$OCI_REPOSITORY@$digest"
          cosign verify --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$CERTIFICATE_ISSUER" \
            "oci-dev.omnilyzer.ai/$OCI_REPOSITORY@$digest"
      - name: Request short-lived Forgejo OIDC and publish prebuilt packages/evidence
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          FORGEJO_AUDIENCE: u:2:316bec9a-53e4-4807-9557-7febdc979d0a
        run: |
          set -euo pipefail
          token_file="$RUNNER_TEMP/task013-forgejo.jwt"
          trap 'rm -f "$token_file"' EXIT
          python3 -m release.request_oidc --audience "$FORGEJO_AUDIENCE" --output "$token_file"
          python3 -m release.publish_forgejo \
            --handoff "$RUNNER_TEMP/platform-release-handoff" \
            --evidence "$RUNNER_TEMP/platform-release-evidence" \
            --token-file "$token_file" --repository "$GITHUB_WORKSPACE" \
            --version "$RELEASE_VERSION" --source-sha "$SOURCE_SHA"
