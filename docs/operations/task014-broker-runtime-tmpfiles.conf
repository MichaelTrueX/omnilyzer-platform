# File: docs/operations/task014-broker-runtime-tmpfiles.conf
# Purpose: Recreate only the original Task 014 DEV broker runtime-directory
#          contract after /run is cleared at boot; no systemd service starts.
# Related: deployment/systemd/dev/omnilyzer-deployment-broker.service,
#          deployment/broker_host_service_contract.py,
#          deployment/dev_final_broker_resources.py,
#          deployment/tests/test_task014_broker_runtime_tmpfiles.py.
# Section 1: Preserve root-owned, non-writable mount namespace ancestry.
d /run/omnilyzer 0755 root root -
d /run/omnilyzer/deployment 0755 root root -
d /run/omnilyzer/deployment/dev 0755 root root -
# Section 2: The two private verifier workspaces are owned by the broker UID.
# No cleanup age: systemd-tmpfiles must not delete live verifier artifacts.
d /run/omnilyzer/deployment/dev/blob-verifier 0700 omnilyzer-broker omnilyzer-broker -
d /run/omnilyzer/deployment/dev/oci-verifier 0700 omnilyzer-broker omnilyzer-broker -
