description = "Removable validation fixture for Prometheus server and multiprocess metrics."
requires-python = ">=3.12,<3.13"
dependencies = [
    "prometheus-client==0.26.0",
]

[tool.setuptools]
py-modules = ["target_app", "target_probe", "validate_live", "multiprocess_probe"]
