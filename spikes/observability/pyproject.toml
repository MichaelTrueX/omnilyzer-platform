# File: spikes/observability/pyproject.toml
# Purpose: Pins direct spike-only dependencies for Task 009 reproduction.

[project]
name = "omnilyzer-observability-spike"
version = "0.0.0"
description = "Removable validation fixture for the Omnilyzer observability contract."
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django==6.1",
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "prometheus-client==0.26.0",
]

[tool.setuptools]
packages = ["contract", "observability_spike"]
