# File: spikes/grafana-security/grafana/grafana.ini
# Purpose: Fail-closed OSS-only Grafana configuration for the isolated OAuth test.

[server]
protocol = http
http_addr = 0.0.0.0
http_port = 3000
domain = 127.0.0.1
enforce_domain = true
root_url = http://127.0.0.1:$__env{TASK011_GRAFANA_PORT}/

[security]
cookie_secure = false
cookie_samesite = lax
allow_embedding = false
content_security_policy = true
disable_gravatar = true

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[users]
allow_sign_up = false
allow_org_create = false

[auth]
disable_login_form = true
oauth_auto_login = false

[auth.basic]
enabled = false

[auth.anonymous]
enabled = false
hide_version = true

[auth.generic_oauth]
enabled = true
name = Keycloak
allow_sign_up = true
client_id = task011-grafana
client_secret = $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
scopes = openid profile email
auth_url = https://127.0.0.1:$__env{TASK011_KEYCLOAK_PORT}/realms/task011-grafana/protocol/openid-connect/auth
token_url = http://keycloak:8080/realms/task011-grafana/protocol/openid-connect/token
api_url = http://keycloak:8080/realms/task011-grafana/protocol/openid-connect/userinfo
use_pkce = true
role_attribute_path = contains(groups[*], '/grafana-admins') && 'Admin' || contains(groups[*], '/grafana-editors') && 'Editor' || contains(groups[*], '/grafana-viewers') && 'Viewer'
role_attribute_strict = true
allow_assign_grafana_admin = false
skip_org_role_sync = false

[auth.proxy]
enabled = false

[public_dashboards]
enabled = false

[snapshots]
enabled = false
external_enabled = false
public_mode = false

[plugins]
plugin_admin_enabled = false
plugin_admin_external_manage_enabled = false
preinstall_disabled = true
preinstall_auto_update = false

[news]
news_feed_enabled = false

[log]
mode = console
level = info
